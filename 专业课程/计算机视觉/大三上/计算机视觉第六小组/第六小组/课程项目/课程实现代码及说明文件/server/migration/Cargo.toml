[package]
name = "migration"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "migration"
path = "src/main.rs"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
sea-orm-migration = { version = "1.1.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
async-trait = "0.1"
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies.sea-orm]
version = "1.1.2"
features = ["runtime-tokio-rustls", "sqlx-postgres"]
