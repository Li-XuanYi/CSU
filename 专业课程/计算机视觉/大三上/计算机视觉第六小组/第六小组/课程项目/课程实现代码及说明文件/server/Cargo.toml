[workspace]
members = [".", "migration"]

[package]
name = "mindsight-gallery-server"
version = "0.1.0"
edition = "2024"

[dependencies]
salvo = { version = "0.80.0", features = ["affix-state", "oapi", "serve-static"] }
salvo-oapi = { version = "0.80.0", features = ["scalar"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Database & ORM
sea-orm = { version = "1.1.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1.2" }

# Configuration & Environment
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1.89"
chrono = "0.4.42"

# Authentication & Security
bcrypt = "0.17.1"
jsonwebtoken = "9.3"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Image Processing & EXIF
image = "0.25"
kamadak-exif = "0.5"
mime_guess = "2.0"
sha2 = "0.10"
